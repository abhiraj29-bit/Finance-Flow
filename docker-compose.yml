version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: financeflow-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status().ok } catch(e) { rs.initiate({_id:\"rs0\", members:[{_id:0, host:\"mongo:27017\"}]}).ok }'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ./backend
    environment:
      PORT: 5004
      MONGODB_URI: mongodb://mongo:27017/financeflow?replicaSet=rs0
      CLIENT_URL: http://localhost:5173
      JWT_SECRET: financeflow_docker_secret_key
      JWT_EXPIRES_IN: 7d
      NODE_ENV: production
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5004:5004"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:5004/api
      VITE_SOCKET_URL: http://localhost:5004
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  mongo-data:
