version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: financeflow-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.example
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/financeflow
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongo
    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:5000/api
      VITE_SOCKET_URL: http://localhost:5000
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  mongo-data:

